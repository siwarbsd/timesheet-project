apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet-dep
  namespace: chap4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timesheet
  template:
    metadata:
      labels:
        app: timesheet
    spec:
      containers:
      - name: timesheet
        image: siwarbessoud/timesheet-devops:1.0.6
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: timesheet-config
        - secretRef:
            name: timesheet-secret
