# Actif seulement avec SPRING_PROFILES_ACTIVE=chaos-monkey
chaos.monkey.enabled=true
chaos.monkey.watcher.restController=true
chaos.monkey.watcher.service=true
chaos.monkey.watcher.controller=false
chaos.monkey.watcher.repository=false
chaos.monkey.watcher.component=false

# Attaques desactivees par defaut, on les declenche a la demande
chaos.monkey.assaults.level=2
chaos.monkey.assaults.latencyActive=false
chaos.monkey.assaults.exceptionsActive=false
chaos.monkey.assaults.killApplicationActive=false
chaos.monkey.assaults.latencyRangeStart=1000
chaos.monkey.assaults.latencyRangeEnd=3000

management.endpoint.chaosmonkey.enabled=true
management.endpoints.web.exposure.include=health,info,chaosmonkey,prometheus
